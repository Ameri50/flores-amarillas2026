<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoy es tu día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-top:#0a0d2b;
    --night-bottom:#171b45;
    --gold:#ffd766;
    --gold-soft:#ffe9a8;
    --gold-deep:#e8a93a;
    --rose-red:#d81f35;
    --rose-red-deep:#8c101f;
    --rose-yellow:#f6c445;
    --rose-yellow-deep:#d99a12;
    --leaf:#2f6b3a;
    --leaf-dark:#1f4d28;
    --card-bg: rgba(10, 13, 43, 0.55);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:inherit;}
  html,body{
    height:100%;
    margin:0;
  }
  body{
    min-height:100%;
    background: radial-gradient(120% 90% at 50% 0%, var(--night-bottom) 0%, var(--night-top) 60%, #05061a 100%);
    font-family:'Quicksand', sans-serif;
    color:var(--gold-soft);
    overflow-x:hidden;
    position:relative;
    display:flex;
    justify-content:center;
  }

  /* ---------- Background: stars ---------- */
  #stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(1);}
    50%{opacity:1; transform:scale(1.6);}
  }

  /* ---------- Background: falling petals ---------- */
  #petals{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-5%;
    font-size:14px;
    filter: drop-shadow(0 0 3px rgba(255,215,102,.5));
    animation: fall linear infinite;
    will-change: transform;
  }
  @keyframes fall{
    0%{ transform: translateY(-10vh) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:.9; }
    92%{ opacity:.9; }
    100%{ transform: translateY(110vh) translateX(var(--drift, 40px)) rotate(360deg); opacity:0; }
  }

  /* ---------- Layout ---------- */
  main{
    position:relative;
    z-index:2;
    width:100%;
    max-width:460px;
    padding: 48px 28px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    min-height:100vh;
    min-height:100dvh;
  }

  h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(48px, 13vw, 68px);
    line-height:1;
    margin: 8px 0 22px;
    color:var(--gold);
    text-shadow:
      0 0 6px rgba(255,215,102,.55),
      0 0 22px rgba(255,215,102,.35),
      0 0 46px rgba(232,169,58,.25);
    letter-spacing:.5px;
  }

  /* ---------- Player ---------- */
  .player{
    width:100%;
    background: var(--card-bg);
    border:1px solid rgba(255,215,102,.25);
    backdrop-filter: blur(6px);
    border-radius:18px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow: 0 0 24px rgba(255,215,102,.08) inset;
  }
  .play-btn{
    flex:0 0 auto;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    background: rgba(255,215,102,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--gold);
    transition: background .2s ease;
  }
  .play-btn:hover{ background: rgba(255,215,102,.18); }
  .play-btn svg{ width:16px; height:16px; }

  .player-info{ flex:1; min-width:0; text-align:left; }
  .track-label{
    font-size:14px;
    font-weight:600;
    color:var(--gold-soft);
    margin-bottom:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .progress-track{
    position:relative;
    height:4px;
    width:100%;
    background: rgba(255,255,255,.15);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .progress-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background: linear-gradient(90deg, var(--gold-deep), var(--gold));
    border-radius:2px;
    animation: fillbar 23s linear infinite;
  }
  @keyframes fillbar{
    from{ width:0%; }
    to{ width:100%; }
  }
  .time-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color: rgba(255,233,168,.65);
  }

  /* ---------- Sunflowers ---------- */
  .garden{
    position:relative;
    width:100%;
    max-width:420px;
    height:300px;
    margin-top:38px;
    flex-shrink:0;
  }
  .garden svg{ width:100%; height:100%; overflow:visible; }

  .stem{
    stroke: var(--leaf-dark);
    stroke-width:4;
    fill:none;
    stroke-linecap:round;
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: grow 1.4s ease-out forwards;
  }
  .leaf{
    fill: var(--leaf);
    transform-origin: center;
    opacity:0;
    animation: leafPop .6s ease-out forwards;
  }
  .flower{
    transform-origin: center;
    opacity:0;
    animation: bloom .8s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .petal-shape{ fill:var(--gold); filter: drop-shadow(0 0 6px rgba(255,215,102,.55)); }
  .petal-shape.alt{ fill: var(--gold-deep); filter: drop-shadow(0 0 6px rgba(255,215,102,.55)); }
  .flower-center{ fill:#4a2f14; }
  .flower-center.alt{ fill:#4a2f14; }

  @keyframes grow{
    to{ stroke-dashoffset:0; }
  }
  @keyframes leafPop{
    to{ opacity:1; transform:scale(1); }
    from{ opacity:0; transform:scale(.4); }
  }
  @keyframes bloom{
    from{ opacity:0; transform: scale(.3) rotate(-15deg); }
    to{ opacity:1; transform: scale(1) rotate(0deg); }
  }
  .flower{ animation-delay: var(--delay, 0s); }
  .leaf{ animation-delay: var(--leaf-delay, 0s); }
  .sway{ animation: sway 4s ease-in-out infinite; animation-delay: var(--sway-delay, 0s); transform-origin: bottom center; }
  @keyframes sway{
    0%,100%{ transform: rotate(-1.5deg); }
    50%{ transform: rotate(1.5deg); }
  }

  .signature{
    margin-top:26px;
    font-size:12px;
    letter-spacing:.3px;
    color: rgba(255,233,168,.55);
  }
  .signature span{ color: var(--gold); }

  @media (prefers-reduced-motion: reduce){
    .petal, .star, .sway, .progress-fill{ animation: none !important; }
    .stem, .leaf, .flower{ animation: none !important; opacity:1 !important; stroke-dashoffset:0 !important; }
  }
</style>
</head>
<body>

<div id="stars"></div>
<div id="petals"></div>

<main>
  <h1 id="titulo">Hoy es tu día</h1>

  <div class="player">
    <button class="play-btn" id="playBtn" aria-label="Reproducir">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
    </button>
    <div class="player-info">
      <div class="track-label" id="mensaje">Feliz 21 de marzo 🧡</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:23</span>
      </div>
    </div>
  </div>

  <div class="garden">
    <svg id="gardenSvg" viewBox="0 0 400 300"></svg>
  </div>

  <div class="signature">Hecho con amor y código <span>@Ameri50</span></div>
</main>

<script>
  // ---------- Jardín de girasoles (cámbialo aquí) ----------
  const FLOWER_COUNT = 42; // <-- cuántas flores quieres (bien buchón)

  // Girasol con muchos pétalos delgados = más parecido a un girasol real
  function sunflowerShape(){
    let s = '';
    const N = 16;
    for(let i=0;i<N;i++){
      const angle = i*(360/N);
      const cx = Math.round(Math.cos((angle-90)*Math.PI/180)*16*100)/100;
      const cy = Math.round(Math.sin((angle-90)*Math.PI/180)*16*100)/100;
      s += `<ellipse class="petal-shape" cx="${cx}" cy="${cy}" rx="6.5" ry="20" transform="rotate(${angle} ${cx} ${cy})"/>`;
    }
    return s;
  }

  function buildGarden(){
    const svg = document.getElementById('gardenSvg');
    const W = 400, BASE = 300, MARGIN = 30;
    const flowers = [];

    for(let i=0;i<FLOWER_COUNT;i++){
      const x = MARGIN + (W-MARGIN*2) * (i/(FLOWER_COUNT-1)) + (Math.random()*12-6);
      const peakY = 55 + Math.random()*110;
      const ctrl1Y = BASE - (BASE-peakY)*0.45;
      const drift = (Math.random()*20-10);
      const scale = 0.5 + Math.random()*0.65;          // mezcla de tamaños, bien llenito
      const stemDelay = (Math.random()*1.2).toFixed(2);
      const flowerDelay = (parseFloat(stemDelay)+0.5).toFixed(2);
      const leafDelay = (parseFloat(stemDelay)+0.3).toFixed(2);
      const swayDelay = (Math.random()*4).toFixed(2);
      const tipX = x + drift, tipY = peakY + 10;

      let html = `<path class="stem" d="M${x.toFixed(1)},${BASE} C${(x+drift*0.3).toFixed(1)},${ctrl1Y.toFixed(1)} ${(x+drift*0.7).toFixed(1)},${(peakY+30).toFixed(1)} ${tipX.toFixed(1)},${tipY.toFixed(1)}" style="animation-delay:${stemDelay}s"></path>`;

      if(i % 2 === 0){
        const lx = x + drift*0.5;
        const ly = (tipY + BASE)/2;
        const dir = i % 4 < 2 ? 1 : -1;
        html += `<path class="leaf" style="--leaf-delay:${leafDelay}s" d="M${lx.toFixed(1)},${ly.toFixed(1)} C${(lx+20*dir).toFixed(1)},${(ly-4).toFixed(1)} ${(lx+24*dir).toFixed(1)},${(ly+12).toFixed(1)} ${(lx+4*dir).toFixed(1)},${(ly+18).toFixed(1)} Z"></path>`;
      }

      html += `<g class="flower sway" style="--delay:${flowerDelay}s; --sway-delay:${swayDelay}s" transform="translate(${tipX.toFixed(1)},${tipY.toFixed(1)}) scale(${scale.toFixed(2)})">
        <g>${sunflowerShape()}<circle class="flower-center" r="13"/></g>
      </g>`;

      flowers.push({ tipY, html });
    }

    // dibuja primero las de atrás (más arriba) para que las de adelante
    // queden completas por encima, como un ramo tupido real.
    flowers.sort((a,b) => a.tipY - b.tipY);
    svg.innerHTML = flowers.map(f => f.html).join('');
  }
  buildGarden();

  // Estrellas
  const starsWrap = document.getElementById('stars');
  const STAR_COUNT = 70;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDuration = (2 + Math.random()*3) + 's';
    s.style.animationDelay = (Math.random()*3) + 's';
    starsWrap.appendChild(s);
  }

  // Pétalos cayendo
  const petalsWrap = document.getElementById('petals');
  const PETAL_COUNT = 18;
  const glyphs = ['🌼','✿','❀'];
  for(let i=0;i<PETAL_COUNT;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    p.style.left = Math.random()*100 + 'vw';
    p.style.setProperty('--drift', (Math.random()*80 - 40) + 'px');
    p.style.animationDuration = (7 + Math.random()*8) + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    p.style.fontSize = (10 + Math.random()*10) + 'px';
    petalsWrap.appendChild(p);
  }

  // Reproductor decorativo (play/pause visual, sin audio real)
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const progressFill = document.getElementById('progressFill');
  const currentTime = document.getElementById('currentTime');
  const totalSeconds = 23;
  let playing = true;
  let elapsed = 0;
  let timer = null;

  function formatTime(s){
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return m + ':' + sec;
  }

  function tick(){
    elapsed += 0.25;
    if(elapsed >= totalSeconds){ elapsed = 0; }
    currentTime.textContent = formatTime(elapsed);
  }

  function setIcon(isPlaying){
    playIcon.innerHTML = isPlaying
      ? '<rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/>'
      : '<polygon points="6,4 20,12 6,20"/>';
  }

  function startTimer(){
    progressFill.style.animationPlayState = 'running';
    timer = setInterval(tick, 250);
  }
  function stopTimer(){
    progressFill.style.animationPlayState = 'paused';
    clearInterval(timer);
  }

  setIcon(true);
  startTimer();

  playBtn.addEventListener('click', () => {
    playing = !playing;
    setIcon(playing);
    if(playing){ startTimer(); } else { stopTimer(); }
  });
</script>

</body>
</html>
